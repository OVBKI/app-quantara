name: Application Windows

# Produit un installateur Windows téléchargeable depuis l'onglet Actions.
# Permet de tester l'application sans chaîne de compilation locale.
on:
  push:
    branches: ["**"]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
  workflow_dispatch:

# Le jeton du dépôt n'a besoin que de lire : ce workflow ne publie rien, il compile.
# Un jeton en écriture serait la seule chose qu'une action tierce compromise pourrait
# retourner contre le dépôt.
permissions:
  contents: read

# Les actions tierces sont épinglées à une empreinte de commit, pas à une étiquette.
# Une étiquette se redéplace : `@v4` désigne aujourd'hui un commit, demain un autre, et
# c'est du code exécuté sur la machine qui produit votre installateur. Le commentaire à
# côté de chaque empreinte dit à quelle version elle correspond, pour que la mise à jour
# reste un geste lisible.

defaults:
  run:
    working-directory: desktop

jobs:
  core:
    name: Cœur métier (tests unitaires)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # Le moteur financier ne dépend ni de Tauri ni du navigateur : il se teste sur
      # Linux, plus rapide et sans licence, avant même de compiler quoi que ce soit.
      - name: Tests
        run: npm test

      - name: Vérification des types
        run: npm run typecheck

  windows:
    name: Installateur Windows
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # branche stable

      # La compilation Rust est longue et surtout répétitive : sans ce cache, chaque
      # exécution recompile l'intégralité des dépendances de Tauri.
      - uses: swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      - name: Compilation de l'application
        run: npm run tauri build

      - name: Publication de l'installateur
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Quantara-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/quantara.exe
          retention-days: 30
          if-no-files-found: error
