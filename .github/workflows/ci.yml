name: Build & Tests

# Compile le projet sur un Mac fourni par GitHub. Utile pour valider le code
# depuis un poste Windows ou Linux, où la chaîne d'outils iOS n'existe pas.
# Les chemins sont filtrés : un runner macOS coûte dix fois un runner Linux, et une
# modification de la version Windows n'a aucune raison de le déclencher.
on:
  push:
    branches: ["**"]
    paths:
      - 'Quantara/**'
      - 'QuantaraCore/**'
      - 'Quantara.xcodeproj/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Cœur métier (tests unitaires)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version d'Xcode
        run: xcodebuild -version

      # Le cœur métier ne dépend ni de SwiftUI ni d'iOS : il se teste directement
      # avec Swift Package Manager, sans simulateur.
      - name: Tests QuantaraCore
        run: swift test --package-path QuantaraCore

  app:
    name: Application iOS (compilation simulateur)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Simulateurs disponibles
        run: xcrun simctl list devices available | head -40

      # CODE_SIGNING_ALLOWED=NO : une compilation pour le simulateur n'a besoin
      # d'aucun certificat, donc d'aucun compte développeur.
      # La sortie complète d'xcodebuild est trop verbeuse pour être lue : on la
      # conserve dans un fichier (publié en artefact) et on n'affiche que les
      # diagnostics, qui sont la seule chose utile depuis un poste sans Mac.
      - name: Compilation
        run: |
          set -o pipefail
          xcodebuild build \
            -project Quantara.xcodeproj \
            -scheme Quantara \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 \
          || {
            echo "::group::Erreurs de compilation"
            grep -E "(error|warning): " xcodebuild.log | sort -u | head -200
            echo "::endgroup::"
            echo "::group::Fin du journal"
            tail -40 xcodebuild.log
            echo "::endgroup::"
            exit 1
          }

      - name: Journal de compilation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      # L'archive produite est un binaire de simulateur : elle peut être déposée
      # sur un service de streaming (Appetize.io par exemple) pour manipuler
      # l'application depuis un navigateur, sans Mac.
      - name: Empaquetage du binaire simulateur
        if: success()
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r -y "$GITHUB_WORKSPACE/Quantara-simulator.zip" Quantara.app

      - name: Publication de l'artefact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Quantara-simulator
          path: Quantara-simulator.zip
          retention-days: 14
