    <title>Quantara</title>
    <!--
      Icône embarquée en SVG plutôt qu'en fichier séparé : sans elle, le navigateur
      réclame /favicon.ico à chaque ouverture et échoue, ce qui laissait une erreur
      permanente dans la console — assez pour masquer une vraie erreur au milieu.
    -->

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a855f7'/%3E%3Cpath d='M9 21.5 14 12l4 6.5L23 10' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
